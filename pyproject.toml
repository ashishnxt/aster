[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nothing-tasks"
dynamic = ["version"]
description = "Dynamic-Island style stopwatch pill + Obsidian task notepad for Ubuntu/GNOME"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# PyGObject / GTK3 come from apt (python3-gi, python3-gi-cairo, gir1.2-gtk-3.0)
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest", "ruff"]

[project.scripts]
nothing-tasks = "nothing_tasks.cli:main"
nothing-tasks-mcp = "nothing_tasks.mcp_server:main"

[tool.setuptools.packages.find]
include = ["nothing_tasks*"]

[tool.setuptools.dynamic]
version = { attr = "nothing_tasks.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
